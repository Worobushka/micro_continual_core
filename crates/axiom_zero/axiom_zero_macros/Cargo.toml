[package]
name = "axiom_zero_macros"
version = "0.1.0"
edition = "2024"
authors = ["Axiom-Zero Contributors"]
description = "Procedural macro validator for the axiom_zero totality toolkit"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiom-zero/axiom-zero"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
